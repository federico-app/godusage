# Postgres and Redis for `npm test` on a developer machine (`npm run test:services`). Not for Coolify.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: godusage
      POSTGRES_PASSWORD: godusage
      POSTGRES_DB: godusage_test
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godusage -d godusage_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
