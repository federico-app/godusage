name: Export Backend Database

# Exports a D1 database as SQL (the workflow artifact), to move the teams backend to the Docker
# server: `node server.mjs import <dump.sql>` loads it into a new SQLite database. Run by hand.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which database to export"
        required: true
        type: choice
        options: [prod, dev]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Export
        run: |
          if [ "${{ inputs.environment }}" = prod ]; then
            npx wrangler d1 export godusage --remote --output godusage-prod.sql
          else
            npx wrangler d1 export godusage-dev --env dev --remote --output godusage-dev.sql
          fi

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: godusage-${{ inputs.environment }}-db
          path: backend/godusage-${{ inputs.environment }}.sql
          retention-days: 3
