name: Deploy Backend

# The teams backend follows the app channels: a push to `develop` that touches backend/ deploys the
# dev Worker and database (godusage-api-dev), and a stable release tag deploys production
# (godusage-api). Tests run first; migrations are applied before the Worker that needs them.
on:
  push:
    branches: [develop]
    paths: ["backend/**", ".github/workflows/backend-deploy.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Which backend to deploy"
        required: true
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One deploy per environment at a time; a newer push waits instead of racing a migration.
    concurrency:
      group: backend-deploy-${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || (startsWith(github.ref, 'refs/tags/') && 'prod') || 'dev' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      TARGET: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || (startsWith(github.ref, 'refs/tags/') && 'prod') || 'dev' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        run: ./script/validate_release_tag.sh "${GITHUB_REF#refs/tags/}"

      - name: Require the Cloudflare token
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Missing required repository secret: CLOUDFLARE_API_TOKEN"; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Apply migrations
        run: |
          if [ "$TARGET" = prod ]; then npm run migrate; else npm run migrate:dev; fi

      - name: Deploy
        run: |
          if [ "$TARGET" = prod ]; then npm run deploy; else npm run deploy:dev; fi
