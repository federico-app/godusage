name: CI

on:
  # The Swift edition ships from `main`. The frozen Tauri edition is preserved on `tauri-legacy`.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    name: Build and Test
    # Builds against the macOS 26 SDK with the package's macOS 15 deployment target (Package.swift
    # .macOS(.v15)), so this compiles the whole codebase — including the `if #available(macOS 26, *)`
    # Liquid Glass branches — for the macOS 15 floor. That is the floor's compile guarantee: a binary
    # built here reports minos 15.0. We do NOT add a macos-15 runner leg — back-deployment compiles
    # against the newest SDK, and a stock macos-15 runner ships Swift 6.1 without the macOS 26 SDK, so
    # it cannot build this package. Runtime verification on Sequoia is a manual smoke pass.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      - name: Test TestFlight gate paths
        run: node --test script/lib/testflight_paths.test.mjs

  # Compile check for the iOS companion app so a PR can't silently break the TestFlight job in
  # release-ios.yml. Unsigned simulator build only — signing and upload happen only at release time.
  ios:
    name: Build iOS App
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          for scheme in "GodUsage" "GodUsage DEV"; do
            xcodebuild -project ios/GodUsageMobile.xcodeproj -scheme "$scheme" \
              -destination "generic/platform=iOS Simulator" \
              CODE_SIGNING_ALLOWED=NO build
          done

  # The teams backend: the suite runs against real Postgres and Redis (service containers), then the
  # Docker image and the proxy Worker are built (nothing is deployed).
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: godusage
          POSTGRES_PASSWORD: godusage
          POSTGRES_DB: godusage_test
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U godusage -d godusage_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://godusage:godusage@127.0.0.1:55432/godusage_test
      TEST_REDIS_URL: redis://127.0.0.1:56379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            backend/proxy/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the Docker image
        run: docker build --tag godusage-api:ci .

      - name: Build the proxy Worker
        working-directory: backend/proxy
        run: |
          npm ci
          npx wrangler deploy --dry-run --env="" --outdir dist
          npx wrangler deploy --dry-run --env dev --outdir dist
